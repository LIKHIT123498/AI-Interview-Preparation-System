<!DOCTYPE html>
<html>
<head>
    <title>AI Interview Prep - WebSocket Test</title>
</head>
<body>
    <h2>Live Interview Terminal</h2>
    <div id="chat" style="height:300px; width:500px; border:1px solid black; overflow-y:scroll; padding:10px; margin-bottom:10px;"></div>
    
    <input type="text" id="answerInput" style="width: 400px;" placeholder="Type your answer here..." autocomplete="off"/>
    <button onclick="sendMessage()">Send</button>

    <script>
        // Ensure you create a session in your DB with ID=1 first
        const ws = new WebSocket("ws://localhost:8000/ws/interview/1");
        const chatDiv = document.getElementById("chat");

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            chatDiv.innerHTML += `<p><b>${data.speaker}:</b> ${data.message}</p>`;
            chatDiv.scrollTop = chatDiv.scrollHeight;
        };

        function sendMessage() {
            const input = document.getElementById("answerInput");
            if(input.value.trim() !== "") {
                chatDiv.innerHTML += `<p><b>You:</b> ${input.value}</p>`;
                ws.send(input.value);
                input.value = "";
            }
        }
    </script>
</body>
</html>
